name: Build Rhythm unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.bundle/**'
      - '.github/workflows/build-rhythm-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and patch project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          parts = sorted(pathlib.Path('.bundle').glob('part_*.b64'))
          assert parts, 'bundle parts not found'
          data = ''.join(p.read_text().strip() for p in parts)
          pathlib.Path('project.zip').write_bytes(base64.b64decode(data))
          PY
          unzip -q project.zip
          test -f rhythm_ios/project.yml

          python3 - <<'PY'
          from pathlib import Path

          # iOS 16.2 is required by the ActivityKit API used in the project.
          p = Path('rhythm_ios/project.yml')
          s = p.read_text()
          s = s.replace('deploymentTarget: "16.1"', 'deploymentTarget: "16.2"')
          if 'ASSETCATALOG_COMPILER_APPICON_NAME' not in s:
              s = s.replace('TARGETED_DEVICE_FAMILY: 1\n', 'TARGETED_DEVICE_FAMILY: 1\n        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon\n')
          p.write_text(s)

          # Ensure bundle executable names are present.
          for path, exe in [('rhythm_ios/Rhythm/Info.plist','Rhythm'), ('rhythm_ios/RhythmLive/Info.plist','RhythmLive')]:
              p = Path(path); s = p.read_text()
              if '<key>CFBundleExecutable</key>' not in s:
                  s = s.replace('<dict>', '<dict>\n<key>CFBundleExecutable</key><string>'+exe+'</string>', 1)
              p.write_text(s)

          # Foreground notification presentation + safer test notification.
          p = Path('rhythm_ios/Rhythm/RhythmNotifications.swift')
          s = p.read_text()
          if 'RhythmNotificationDelegate' not in s:
              s = s.replace('import UserNotifications\n', '''import UserNotifications\n\nfinal class RhythmNotificationDelegate: NSObject, UNUserNotificationCenterDelegate {\n    static let shared = RhythmNotificationDelegate()\n    func userNotificationCenter(_ center: UNUserNotificationCenter, willPresent notification: UNNotification, withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {\n        completionHandler([.banner, .sound, .badge, .list])\n    }\n}\n''')
          old = '''    func test() async {\n        let content = UNMutableNotificationContent()\n        content.title = "Ритм · проверка"\n        content.body = "Уведомления работают"\n        content.sound = .default\n        let trigger = UNTimeIntervalNotificationTrigger(timeInterval: 1, repeats: false)\n        let request = UNNotificationRequest(identifier: "rhythm-test", content: content, trigger: trigger)\n        try? await UNUserNotificationCenter.current().add(request)\n    }'''
          new = '''    func test() async {\n        guard await request() else { return }\n        let center = UNUserNotificationCenter.current()\n        center.removePendingNotificationRequests(withIdentifiers: ["rhythm-test"])\n        let content = UNMutableNotificationContent()\n        content.title = "Ритм · проверка"\n        content.body = "Уведомления работают — тест доставлен."\n        content.sound = .default\n        let trigger = UNTimeIntervalNotificationTrigger(timeInterval: 2, repeats: false)\n        let request = UNNotificationRequest(identifier: "rhythm-test", content: content, trigger: trigger)\n        try? await center.add(request)\n    }'''
          s = s.replace(old, new)
          s = s.replace('center.removeAllPendingNotificationRequests()', '''let pending = await center.pendingNotificationRequests()\n        center.removePendingNotificationRequests(withIdentifiers: pending.map(\\.identifier).filter { $0 != "rhythm-test" })''')
          p.write_text(s)

          # Install notification center delegate at application startup.
          p = Path('rhythm_ios/Rhythm/RhythmApp.swift')
          s = p.read_text()
          if 'RhythmAppDelegate' not in s:
              s = s.replace('import SwiftUI\n', '''import SwiftUI\nimport UserNotifications\n\nfinal class RhythmAppDelegate: NSObject, UIApplicationDelegate {\n    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey : Any]? = nil) -> Bool {\n        UNUserNotificationCenter.current().delegate = RhythmNotificationDelegate.shared\n        return true\n    }\n}\n''')
              s = s.replace('@main struct RhythmApp: App {\n', '@main struct RhythmApp: App {\n    @UIApplicationDelegateAdaptor(RhythmAppDelegate.self) private var appDelegate\n')
          p.write_text(s)

          # Give immediate UI feedback when the test button is pressed.
          p = Path('rhythm_ios/Rhythm/SettingsView.swift')
          s = p.read_text().replace('Button("Отправить тестовое уведомление"){Task{await RhythmNotifications.shared.test()}}.buttonStyle(.bordered)', 'Button("Отправить тестовое уведомление"){Task{await RhythmNotifications.shared.test();status="Тест отправлен: баннер должен появиться через 2 секунды"}}.buttonStyle(.bordered)')
          p.write_text(s)
          PY

          # Generate a complete AppIcon asset catalog with no external dependencies.
          python3 - <<'PY'
          import json, math, struct, zlib
          from pathlib import Path

          root = Path('rhythm_ios/Rhythm/Assets.xcassets/AppIcon.appiconset')
          root.mkdir(parents=True, exist_ok=True)
          (root.parent/'Contents.json').write_text(json.dumps({'info':{'author':'xcode','version':1}}))

          def png(path, n):
              scale=n/1024.0
              pts=[(220,545),(350,545),(420,360),(505,680),(580,440),(640,545),(805,545)]
              w=max(3,int(46*scale))
              buf=[]
              def distseg(px,py,a,b):
                  ax,ay=a; bx,by=b; dx=bx-ax; dy=by-ay
                  if dx==dy==0:return math.hypot(px-ax,py-ay)
                  t=max(0,min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)))
                  return math.hypot(px-(ax+t*dx),py-(ay+t*dy))
              for y in range(n):
                  row=bytearray([0])
                  yy=y/scale
                  for x in range(n):
                      xx=x/scale
                      if xx+yy < 1024: c=(190,46,62)
                      else: c=(44,92,204)
                      if 130<xx<894 and 130<yy<894: c=(20,22,29)
                      if any(distseg(xx,yy,pts[i],pts[i+1]) <= w/(2*scale) for i in range(len(pts)-1)):
                          c=(248,248,250)
                      row.extend(c)
                  buf.append(bytes(row))
              raw=b''.join(buf)
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              out=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',n,n,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              Path(path).write_bytes(out)

          specs=[('20x20','2x',40),('20x20','3x',60),('29x29','2x',58),('29x29','3x',87),('40x40','2x',80),('40x40','3x',120),('60x60','2x',120),('60x60','3x',180)]
          images=[]
          for size,sc,n in specs:
              fn=f'AppIcon-{size}@{sc}.png'; png(root/fn,n)
              images.append({'idiom':'iphone','size':size,'scale':sc,'filename':fn})
          png(root/'AppIcon-1024.png',1024)
          images.append({'idiom':'ios-marketing','size':'1024x1024','scale':'1x','filename':'AppIcon-1024.png'})
          (root/'Contents.json').write_text(json.dumps({'images':images,'info':{'author':'xcode','version':1}},indent=2))
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: rhythm_ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: rhythm_ios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build

      - name: Validate bundle metadata
        working-directory: rhythm_ios
        shell: bash
        run: |
          set -euo pipefail
          APP="build/app/Rhythm.app"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test "$EXE" = "Rhythm"
          test -f "$APP/$EXE"
          file "$APP/$EXE" | grep -q 'Mach-O'
          test -f "$APP/AppIcon60x60@2x.png" || test -f "$APP/Assets.car"
          EXT="$APP/PlugIns/RhythmLive.appex"
          EEXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")
          test "$EEXE" = "RhythmLive"
          test -f "$EXT/$EEXE"

      - name: Package IPA
        working-directory: rhythm_ios
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/app/Rhythm.app"
          rm -rf build/Payload build/Rhythm.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Rhythm.app
          cd build
          /usr/bin/zip -qry Rhythm.ipa Payload
          ls -lh Rhythm.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-unsigned-ipa
          path: rhythm_ios/build/Rhythm.ipa
          if-no-files-found: error
          retention-days: 30
