name: Build exteraGram iOS port

on:
  push:
    branches: [ exteragram-ios-port ]
    paths:
      - '.github/workflows/build-exteragram-ios.yml'
      - 'exteragram-ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout port overlay
        uses: actions/checkout@v4
        with:
          ref: exteragram-ios-port
          path: port-overlay

      - name: Checkout Swiftgram base
        uses: actions/checkout@v4
        with:
          repository: Swiftgram/Telegram-iOS
          ref: master
          submodules: recursive
          fetch-depth: 0
          path: telegram-ios

      - name: Select Xcode required by Swiftgram
        shell: bash
        run: |
          set -euo pipefail
          cd telegram-ios
          XCODE_VERSION=$(python3 - <<'PY'
          import json
          print(json.load(open('versions.json'))['xcode'])
          PY
          )
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Patch Swiftgram build configuration
        shell: bash
        run: |
          set -euo pipefail
          cd telegram-ios
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build-system/appstore-configuration.json')
          data = json.loads(p.read_text())
          data.setdefault('sg_config', '{}')
          p.write_text(json.dumps(data, indent=4) + '\n')
          print('sg_config:', data['sg_config'])
          PY

      - name: Apply exteraGram iOS overlay
        shell: bash
        run: |
          set -euo pipefail
          bash port-overlay/exteragram-ios/apply.sh "$GITHUB_WORKSPACE/telegram-ios"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_exteragram_ios"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 - <<'PY'
          import json
          print(json.load(open('versions.json'))['app'])
          PY
          )
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=$(find bazel-out -path '*/bin/Telegram/Telegram.ipa' -type f | head -n 1)
          test -n "$IPA"
          cp "$IPA" "$GITHUB_WORKSPACE/out/exteraGram-iOS.ipa"
          echo "Built from Swiftgram $APP_VERSION, build $BUILD_NUMBER"
          ls -lh "$GITHUB_WORKSPACE/out/exteraGram-iOS.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: exteraGram-iOS-unsigned
          path: out/exteraGram-iOS.ipa
          if-no-files-found: error
          retention-days: 30
